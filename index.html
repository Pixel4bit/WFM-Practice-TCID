  body { font-family: 'Inter', sans-serif; background-color: #F6F4EC; }

  ::-webkit-scrollbar { height: 8px; width: 8px; }
  ::-webkit-scrollbar-track { background: #EDE9DA; }
  ::-webkit-scrollbar-thumb { background: #9FB878; border-radius: 4px; }

  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button { opacity: 1; }

  .stamp { animation: stampIn 0.4s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes stampIn {
    0% { transform: scale(2.2) rotate(-14deg); opacity: 0; }
    60% { transform: scale(0.92) rotate(-8deg); opacity: 1; }
    100% { transform: scale(1) rotate(-8deg); opacity: 1; }
  }

  .toast-enter { animation: toastIn 0.35s ease-out forwards; }
  @keyframes toastIn { from { transform: translateY(16px) scale(0.95); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
  .toast-exit { animation: toastOut 0.3s ease-in forwards; }
  @keyframes toastOut { from { transform: translateY(0) scale(1); opacity: 1; } to { transform: translateY(16px) scale(0.9); opacity: 0; } }

  .row-flash { animation: flash 0.6s ease-out; }
  @keyframes flash { 0% { background-color: rgba(157,184,120,0.35); } 100% { background-color: transparent; } }

  .modal-enter { animation: modalIn 0.25s ease-out forwards; }
  @keyframes modalIn { from { transform: translateY(10px) scale(0.97); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }

  .shake { animation: shake 0.4s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); } 40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); } 80% { transform: translateX(6px); }
  }

  input[type="range"] { -webkit-appearance: none; height: 4px; border-radius: 2px; background: #C3D3A6; }
  input[type="range"]::-webkit-slider-thumb {

  .sidebar-link:hover { background: rgba(246,244,236,0.06); color: #F6F4EC; }

  .sidebar-section-label {

/* ============ CALCULATIONS ============ */
function calc(method, employees, params) {
  if (method === 'PPM') {
    const p = params.PPM;
    const maxPotential = p.standardMp * p.rateBase;
    const rows = employees.map(e => ({ ...e, bill: (e.days / p.fullDays) * p.rateBase }));
    const actual = rows.reduce((s, r) => s + r.bill, 0);
    const achievement = maxPotential > 0 ? (actual / maxPotential) * 100 : 0;
    return { maxPotential, actual, achievement, rows };
  }
  if (method === 'PPH') {
    const p = params.PPH;
    const ratePerMp = p.networkDaysStd * p.hoursPerDay * p.pricePerHour;
    const maxPotential = p.standardMp * ratePerMp;
    const rows = employees.map(e => ({ ...e, bill: e.networkDays * p.hoursPerDay * p.pricePerHour }));
    const actual = rows.reduce((s, r) => s + r.bill, 0);
    const achievement = maxPotential > 0 ? (actual / maxPotential) * 100 : 0;
    return { maxPotential, actual, achievement, rows };
  }
  // PPI
  const p = params.PPI;
  const maxPotential = p.forecastInteraction * p.pricePerInteraction;
  const actual = p.actualInteraction * p.pricePerInteraction;
  const achievement = maxPotential > 0 ? (actual / maxPotential) * 100 : 0;
  return { maxPotential, actual, achievement, rows: [] };
}

/* ============ TOAST ============ */
function showToast(message, tone = 'moss') {
  const host = document.getElementById('toast-host');
  if (!host) return;
  clearTimeout(toastTimeout);
  const toneMap = {
    moss: { bg: 'bg-moss-700', icon: '✓' },
    rust: { bg: 'bg-rust', icon: '✕' },
    gold: { bg: 'bg-gold', icon: '!' },
  };
  const tn = toneMap[tone] || toneMap.moss;
  host.innerHTML = `
    <div class="toast-enter ${tn.bg} text-paper px-5 py-3.5 rounded-lg shadow-2xl flex items-center gap-3 min-w-[280px] max-w-[380px]" id="toast-el">
      <span class="w-6 h-6 rounded-full bg-white/20 flex items-center justify-center text-sm font-bold shrink-0">${tn.icon}</span>
      <span class="text-sm font-medium leading-snug">${message}</span>
    </div>`;
  toastTimeout = setTimeout(() => {
    const el = document.getElementById('toast-el');
    if (el) {
      el.classList.remove('toast-enter');
      el.classList.add('toast-exit');
      setTimeout(() => { host.innerHTML = ''; }, 280);
    }
  }, 3200);
}

/* ============ MAIN RENDER ============ */
function render() {
  const app = document.getElementById('app');
  const { maxPotential, actual, achievement, rows } = calc(state.method, state.employees, state.params);

  app.innerHTML = `
    <div class="flex">
      ${renderSidebar()}
      <div class="flex-1 min-w-0">
        ${renderTopbar()}
        <div id="toast-host" class="fixed bottom-6 right-6 z-50"></div>
        <main class="px-6 lg:px-10 py-8">
          ${renderPage(maxPotential, actual, achievement, rows)}
        </main>
        ${renderFooter()}
      </div>
    </div>
    ${state.empModal ? renderEmployeeModal() : ''}
  `;

  attachGlobalEvents();

  if (state.page === 'dashboard') {
    drawChart('chart-canvas', maxPotential, actual, false);
  }
  if (state.page === 'create' && state.creatorAuthed) {
    attachCreateEvents();
  }
  if (state.page === 'create' && !state.creatorAuthed) {
    attachCreatorGateEvents();
  }
  if (state.page === 'pending' || state.page === 'approved') {
    attachApproverEvents();
    if (state.page === 'pending' && state.approverAuthed && state.status === 'pending') {
      const snap = calc(state.submittedSnapshot.method, state.submittedSnapshot.employees, state.submittedSnapshot.params);
      drawChart('chart-canvas-approver', snap.maxPotential, snap.actual, true);
    }
  }
  if (state.page === 'database' || state.page === 'employees') {
    attachEmployeeCrudEvents();
  }
  if (state.page === 'settings') {
    attachSettingsEvents();
  }
  if (state.empModal) attachEmployeeModalEvents();
}

function renderPage(maxPotential, actual, achievement, rows) {
  switch (state.page) {
    case 'dashboard':  return renderDashboard(maxPotential, actual, achievement, rows);
    case 'create':     return state.creatorAuthed ? renderCreate(maxPotential, actual, achievement, rows) : renderCreatorGate();
    case 'mybillings': return renderMyBillings();
    case 'pending':    return renderPending(maxPotential, actual, achievement, rows);
    case 'approved':   return renderApprovedList();
    case 'database':   return renderDatabase(rows);
    case 'employees':  return renderEmployeesPage();
    case 'settings':   return renderSettings();
    default:           return '';
  }
}

/* ---------- PARAMETERS PANEL (per method) ---------- */
function renderParamsPanel(locked) {
  const editing = state.editingParams;
  const draft = editing ? state.paramsDraft : state.params;
  const m = state.method;
  const methodNameKey = { PPM: 'methodPPMName', PPH: 'methodPPHName', PPI: 'methodPPIName' };

  const editBtns = !locked ? (editing ? `
    <div class="flex items-center gap-2">
      <button id="btn-params-cancel" class="text-xs font-mono px-3 py-1.5 rounded border border-moss-300 text-moss-700 hover:bg-moss-50">${t('cancel')}</button>
      <button id="btn-params-save" class="text-xs font-mono px-3 py-1.5 rounded bg-moss-700 text-paper hover:bg-moss-800">${t('save')}</button>
    </div>` : `
    <button id="btn-params-edit" class="text-xs font-mono px-3 py-1.5 rounded border border-moss-400 text-moss-700 hover:bg-moss-100 flex items-center gap-1.5">
      <span>✎</span> ${t('editParameter')}
    </button>`) : `<span class="font-mono text-[10px] text-moss-700/50">${t('locked')}</span>`;

  let fields = '';
  if (m === 'PPM') {
    const p = draft.PPM;
    fields = `
      ${paramField(t('priceManPowerRp'), 'param-ppm-rateBase', p.rateBase, editing, 0, 100000)}
      ${paramField(t('manPowerStd'), 'param-ppm-standardMp', p.standardMp, editing, 1, 1)}
      ${paramField(t('fullDaysBase'), 'param-ppm-fullDays', p.fullDays, editing, 1, 1, 31)}
    `;
  } else if (m === 'PPH') {
    const p = draft.PPH;
    fields = `
      ${paramField(t('priceHourRp'), 'param-pph-pricePerHour', p.pricePerHour, editing, 0, 500)}
      ${paramField(t('hourPerDayLabel'), 'param-pph-hoursPerDay', p.hoursPerDay, editing, 1, 1, 24)}
      ${paramField(t('networkDaysStd'), 'param-pph-networkDaysStd', p.networkDaysStd, editing, 1, 1, 31)}
      ${paramField(t('manPowerStd'), 'param-pph-standardMp', p.standardMp, editing, 1, 1)}
    `;
  } else {
    const p = draft.PPI;
    fields = `
      ${paramField(t('forecastMonthlyInteraction'), 'param-ppi-forecastInteraction', p.forecastInteraction, editing, 0, 1000)}
      ${paramField(t('priceInteractionRp'), 'param-ppi-pricePerInteraction', p.pricePerInteraction, editing, 0, 50)}
      ${paramField(t('actualMonthlyInteraction'), 'param-ppi-actualInteraction', p.actualInteraction, editing, 0, 1000)}
      ${paramField(t('productivityPerMp'), 'param-ppi-productivityPerMp', p.productivityPerMp, editing, 0, 100)}
      ${paramField(t('manPowerHash'), 'param-ppi-standardMp', p.standardMp, editing, 1, 1)}
    `;
  }

  return `
  <div class="bg-white/60 border border-moss-300/60 rounded-xl p-5 mb-2">
    <div class="flex items-center justify-between mb-4">
      <div>
        <h3 class="font-semibold text-sm tracking-wide">${t('contractParams')} — ${m}</h3>
        <p class="text-xs text-moss-800/60 mt-0.5">${t(methodNameKey[m])} — ${t('adjustToContract')}</p>
      </div>
      ${editBtns}
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-3 lg:grid-cols-4 gap-4">
      ${fields}
    </div>
  </div>`;
}

function paramField(label, id, value, editing, min, step, max) {
  return `
  <div>
    <label class="text-[11px] font-mono text-moss-700/60 tracking-wide block mb-1.5">${label}</label>
    ${editing ? `
      <input type="number" id="${id}" value="${value}" min="${min}" step="${step}" ${max !== undefined ? `max="${max}"` : ''}
        class="w-full border border-moss-300 rounded-lg px-3 py-2 text-sm font-mono bg-white focus:outline-none focus:ring-1 focus:ring-moss-500">
    ` : `<p class="font-mono text-base font-semibold text-moss-800">${typeof value === 'number' && (id.includes('rate') || id.includes('price')) ? fmtIDR(value) : fmtNum(value)}</p>`}
  </div>`;
}

/* ---------- MY BILLINGS ---------- */
function renderMyBillings() {
  const records = [];
  if (state.status !== 'draft' && state.submittedSnapshot) {
    const snap = calc(state.submittedSnapshot.method, state.submittedSnapshot.employees, state.submittedSnapshot.params);
    records.push({
      method: state.submittedSnapshot.method, status: state.status,
      maxPotential: snap.maxPotential, actual: snap.actual, achievement: snap.achievement,
    });
  }
  state.history.forEach(h => records.push(h));

  if (records.length === 0) {
    return emptyState(t('noBillingYet'), t('noBillingYetSub'));
  }

  return `
  <div class="bg-white/60 border border-moss-300/60 rounded-xl overflow-hidden">
    <table class="w-full text-sm">
      <thead class="bg-ledger/70">
        <tr class="text-left text-moss-700/70 font-mono text-[11px] tracking-wide">
          <th class="px-5 py-2.5 font-medium">${t('colMethod')}</th>
          <th class="px-3 py-2.5 font-medium">${t('colPeriod')}</th>
          <th class="px-3 py-2.5 font-medium text-right">${t('colMaxPotential')}</th>
          <th class="px-3 py-2.5 font-medium text-right">${t('colActualBill')}</th>
          <th class="px-3 py-2.5 font-medium text-right">${t('colAchievement')}</th>
          <th class="px-5 py-2.5 font-medium text-right">${t('colStatus')}</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-moss-200/60">
        ${records.map(r => `
          <tr>
            <td class="px-5 py-3 font-semibold">${r.method}</td>
            <td class="px-3 py-3 text-xs text-moss-800/60">${t('periodLabel')}</td>
            <td class="px-3 py-3 text-right font-mono text-xs">${fmtIDR(r.maxPotential)}</td>
            <td class="px-3 py-3 text-right font-mono text-xs font-semibold">${fmtIDR(r.actual)}</td>
            <td class="px-3 py-3 text-right font-mono text-xs">${r.achievement.toFixed(2)}%</td>
            <td class="px-5 py-3 text-right">${statusBadge(r.status)}</td>
          </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}

/* ---------- CHART ---------- */
function drawChart(canvasId, maxPotential, actual, small) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  if (typeof Chart === 'undefined') return; // Chart.js CDN unavailable; skip gracefully
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
  const ctx = canvas.getContext('2d');
  const maxLabel = state.lang === 'id' ? 'Potensi Maksimum' : 'Max Potential';
  const actualLabel = state.lang === 'id' ? 'Billing Aktual' : 'Actual Bill';
  chartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: [maxLabel, actualLabel],
      datasets: [{
        data: [maxPotential, actual],
        backgroundColor: ['#7D9C55', '#B5502F'],
        borderRadius: 6,
        borderSkipped: false,
        barThickness: small ? 46 : 80,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1D2814',
          titleFont: { family: 'IBM Plex Mono' },
          bodyFont: { family: 'IBM Plex Mono' },
          padding: 10,
          callbacks: { label: (c) => ' ' + fmtIDR(c.parsed.y) }
        },
        datalabels: false,
      },
      scales: {
        y: {
          beginAtZero: true,
          grid: { color: 'rgba(70,96,46,0.1)' },
          ticks: { font: { family: 'IBM Plex Mono', size: 10 }, color: '#46602E', callback: (v) => (v/1000000) + 'jt' }
        },
        x: {
          grid: { display: false },
          ticks: { font: { family: 'Inter', size: 12, weight: '600' }, color: '#1D2814' }
        }
      }
    }
  });
}

/* ============ UTIL ============ */
function escapeHtml(str) {
  if (str === undefined || str === null) return '';
  return String(str).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#39;');
}

/* ============ GLOBAL EVENTS (sidebar / role) ============ */
function attachGlobalEvents() {
  document.querySelectorAll('.sidebar-link').forEach(link => {
    link.addEventListener('click', () => {
      const page = link.dataset.page;
      state.page = page;
      // auto-switch role context for approver pages
      if (page === 'pending' || page === 'approved') state.role = 'approver';
      if (page === 'create' || page === 'mybillings' || page === 'dashboard') state.role = 'creator';
      render();
    });
  });
  const btnRoleToggle = document.getElementById('btn-role-toggle');
  if (btnRoleToggle) {
    btnRoleToggle.addEventListener('click', () => {
      state.role = state.role === 'creator' ? 'approver' : 'creator';
      state.page = state.role === 'approver' ? 'pending' : 'dashboard';
      render();
    });
  }
  document.querySelectorAll('.method-card').forEach(card => {
    card.addEventListener('click', () => {
      if (state.status === 'pending' || state.status === 'approved') return;
      state.method = card.dataset.method;
      render();
    });
  });
}

/* ============ EVENTS: CREATOR GATE ============ */
function attachCreatorGateEvents() {
  const btnLogin = document.getElementById('btn-creator-login');
  const pwInput = document.getElementById('creator-password');
  if (btnLogin && pwInput) {
    const tryLogin = () => {
      if (pwInput.value === CREATOR_PASSWORD) { state.creatorAuthed = true; state.creatorAuthError = ''; render(); }
      else { state.creatorAuthError = t('incorrectPassword'); render(); }
    };
    btnLogin.addEventListener('click', tryLogin);
    pwInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryLogin(); });
    pwInput.focus();
  }
}

/* ============ EVENTS: CREATE BILLING PAGE ============ */
function attachCreateEvents() {
  const { maxPotential, actual } = calc(state.method, state.employees, state.params);
  drawChart('chart-canvas-create', maxPotential, actual, true);

  const btnCreatorLogout = document.getElementById('btn-creator-logout');
  if (btnCreatorLogout) btnCreatorLogout.addEventListener('click', () => {
    state.creatorAuthed = false;
    state.creatorAuthError = '';
    render();
    showToast(t('toastCreatorLogout'), 'gold');
  });

  const btnParamsEdit = document.getElementById('btn-params-edit');
  if (btnParamsEdit) btnParamsEdit.addEventListener('click', () => {
    state.editingParams = true;
    state.paramsDraft = JSON.parse(JSON.stringify(state.params));
    render();
  });
  const btnParamsCancel = document.getElementById('btn-params-cancel');
  if (btnParamsCancel) btnParamsCancel.addEventListener('click', () => {
    state.editingParams = false;
    state.paramsDraft = null;
    render();
  });
  const btnParamsSave = document.getElementById('btn-params-save');
  if (btnParamsSave) btnParamsSave.addEventListener('click', () => {
    const m = state.method;
    const num = (id, fallback = 0) => { const v = parseFloat(document.getElementById(id)?.value); return isNaN(v) ? fallback : v; };
    const int = (id, fallback = 0) => { const v = parseInt(document.getElementById(id)?.value); return isNaN(v) ? fallback : v; };

    if (m === 'PPM') {
      state.params.PPM = {
        rateBase: Math.max(0, num('param-ppm-rateBase', state.params.PPM.rateBase)),
        standardMp: Math.max(1, int('param-ppm-standardMp', state.params.PPM.standardMp)),
        fullDays: Math.max(1, Math.min(31, int('param-ppm-fullDays', state.params.PPM.fullDays))),
      };
      state.employees.forEach(e => { if (e.days > state.params.PPM.fullDays) e.days = state.params.PPM.fullDays; });
    } else if (m === 'PPH') {
      state.params.PPH = {
        pricePerHour: Math.max(0, num('param-pph-pricePerHour', state.params.PPH.pricePerHour)),
        hoursPerDay: Math.max(1, Math.min(24, int('param-pph-hoursPerDay', state.params.PPH.hoursPerDay))),
        networkDaysStd: Math.max(1, Math.min(31, int('param-pph-networkDaysStd', state.params.PPH.networkDaysStd))),
        standardMp: Math.max(1, int('param-pph-standardMp', state.params.PPH.standardMp)),
      };
      state.employees.forEach(e => { if (e.networkDays > state.params.PPH.networkDaysStd) e.networkDays = state.params.PPH.networkDaysStd; });
    } else {
      state.params.PPI = {
        forecastInteraction: Math.max(0, int('param-ppi-forecastInteraction', state.params.PPI.forecastInteraction)),
        pricePerInteraction: Math.max(0, num('param-ppi-pricePerInteraction', state.params.PPI.pricePerInteraction)),
        actualInteraction: Math.max(0, int('param-ppi-actualInteraction', state.params.PPI.actualInteraction)),
        productivityPerMp: Math.max(0, int('param-ppi-productivityPerMp', state.params.PPI.productivityPerMp)),
        standardMp: Math.max(1, int('param-ppi-standardMp', state.params.PPI.standardMp)),
      };
    }
    state.editingParams = false;
    state.paramsDraft = null;
    render();
    showToast(t('toastParamsUpdated'), 'moss');
  });

  attachEmployeeCrudEvents();

  const btnSubmit = document.getElementById('btn-submit');
  if (btnSubmit) btnSubmit.addEventListener('click', () => {
    if (state.method !== 'PPI' && state.employees.length === 0) {
      showToast(t('toastSubmitFail'), 'rust');
      return;
    }
    state.status = 'pending';
    state.submittedSnapshot = {
      method: state.method,
      employees: JSON.parse(JSON.stringify(state.employees)),
      params: JSON.parse(JSON.stringify(state.params)),
    };
    state.rejectNote = '';
    render();
    showToast(t('toastSubmitted'), 'gold');
  });
}

  document.querySelectorAll('.days-slider').forEach(slider => {
    slider.addEventListener('input', (e) => updateDays(e.target.dataset.nip, e.target.value, e.target.dataset.field || 'days'));
  });
  document.querySelectorAll('.days-input').forEach(input => {
    input.addEventListener('change', (e) => {
      let v = parseInt(e.target.value);
      if (isNaN(v)) v = 0;
      const field = e.target.dataset.field || 'days';
      const max = field === 'networkDays' ? state.params.PPH.networkDaysStd : state.params.PPM.fullDays;
      v = Math.max(0, Math.min(max, v));
      updateDays(e.target.dataset.nip, v, field);
    });
  });

  const btnAdd = document.getElementById('btn-emp-add');
  if (btnAdd) btnAdd.addEventListener('click', () => {
    state.empModal = { mode: 'add', nip: nextNip, name: '', note: '', days: state.params.PPM.fullDays };
    render();
  });
  document.querySelectorAll('.btn-emp-edit').forEach(btn => {
    btn.addEventListener('click', () => {
      const nip = parseInt(btn.dataset.nip);
      const emp = state.employees.find(e => e.nip === nip);
      if (emp) {
        const isHourMethod = state.method === 'PPH';
        state.empModal = { mode: 'edit', nip: emp.nip, name: emp.name, note: emp.note, days: isHourMethod ? emp.networkDays : emp.days };
        render();
      }
    });
  });
  document.querySelectorAll('.btn-emp-delete').forEach(btn => {
    btn.addEventListener('click', () => { state.empDeleteConfirm = parseInt(btn.dataset.nip); render(); });
  });
  document.querySelectorAll('.btn-emp-delete-cancel').forEach(btn => {
    btn.addEventListener('click', () => { state.empDeleteConfirm = null; render(); });
  });
  document.querySelectorAll('.btn-emp-delete-confirm').forEach(btn => {
    btn.addEventListener('click', () => {
      const nip = parseInt(btn.dataset.nip);
      const emp = state.employees.find(e => e.nip === nip);
      state.employees = state.employees.filter(e => e.nip !== nip);
      state.empDeleteConfirm = null;
      render();
      showToast(`${t('toastEmpDeleted')} ${emp ? escapeHtml(emp.name) : ''} ${t('toastEmpDeletedSuffix')}`, 'rust');
    });
  });
}

function updateDays(nip, value, field) {
  nip = parseInt(nip);
  const emp = state.employees.find(e => e.nip === nip);
  if (emp) {
    emp[field] = parseInt(value);
    state.lastEditedNip = nip;
  }
  render();
  state.lastEditedNip = null;
}

/* ============ EVENTS: EMPLOYEE MODAL ============ */
function attachEmployeeModalEvents() {
  const overlay = document.getElementById('emp-modal-overlay');
  const closeModal = () => { state.empModal = null; render(); };
  const btnClose = document.getElementById('btn-emp-modal-close');
  const btnCancel = document.getElementById('btn-emp-modal-cancel');
  if (btnClose) btnClose.addEventListener('click', closeModal);
  if (btnCancel) btnCancel.addEventListener('click', closeModal);
  if (overlay) overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });

  const btnSave = document.getElementById('btn-emp-modal-save');
  if (btnSave) btnSave.addEventListener('click', () => {
    const errEl = document.getElementById('emp-modal-error');
    const isHourMethod = state.method === 'PPH';
    const maxDay = isHourMethod ? state.params.PPH.networkDaysStd : state.params.PPM.fullDays;
    const nipVal = parseInt(document.getElementById('emp-nip').value);
    const nameVal = document.getElementById('emp-name').value.trim();
    const noteVal = document.getElementById('emp-note').value.trim();
    let daysVal = parseInt(document.getElementById('emp-days').value);
    if (isNaN(daysVal)) daysVal = 0;
    daysVal = Math.max(0, Math.min(maxDay, daysVal));

    if (!nameVal) { errEl.textContent = t('errNameRequired'); errEl.classList.remove('hidden'); return; }
    if (isNaN(nipVal)) { errEl.textContent = t('errNipRequired'); errEl.classList.remove('hidden'); return; }

    if (state.empModal.mode === 'add') {
      if (state.employees.some(e => e.nip === nipVal)) { errEl.textContent = t('errNipUsed'); errEl.classList.remove('hidden'); return; }
      const newEmp = { nip: nipVal, name: nameVal, note: noteVal || '-', days: state.params.PPM.fullDays, networkDays: state.params.PPH.networkDaysStd };
      newEmp[isHourMethod ? 'networkDays' : 'days'] = daysVal;
      state.employees.push(newEmp);
      if (nipVal >= nextNip) nextNip = nipVal + 1;
      state.empModal = null;
      render();
      showToast(`${t('toastEmpAdded')} ${escapeHtml(nameVal)} ${t('toastEmpAddedSuffix')}`, 'moss');
    } else {
      const emp = state.employees.find(e => e.nip === state.empModal.nip);
      if (emp) {
        emp.name = nameVal;
        emp.note = noteVal || '-';
        emp[isHourMethod ? 'networkDays' : 'days'] = daysVal;
      }
      state.empModal = null;
      render();
      showToast(`${escapeHtml(nameVal)}${t('toastEmpUpdatedSuffix')}`, 'moss');
    }
  });
}

/* ============ EVENTS: APPROVER ============ */
function attachApproverEvents() {
  const btnLogin = document.getElementById('btn-approver-login');
  const pwInput = document.getElementById('approver-password');
  if (btnLogin && pwInput) {
    const tryLogin = () => {
      if (pwInput.value === APPROVER_PASSWORD) { state.approverAuthed = true; state.authError = ''; render(); }
      else { state.authError = t('incorrectPassword'); render(); }
    };
    btnLogin.addEventListener('click', tryLogin);
    pwInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryLogin(); });
    pwInput.focus();
  }

  const btnLogout = document.getElementById('btn-approver-logout');
  if (btnLogout) btnLogout.addEventListener('click', () => {
    state.approverAuthed = false;
    state.authError = '';
    render();
    showToast(t('toastApproverLogout'), 'gold');
  });

  const btnApprove = document.getElementById('btn-approve');
  if (btnApprove) btnApprove.addEventListener('click', () => {
    const snap = calc(state.submittedSnapshot.method, state.submittedSnapshot.employees, state.submittedSnapshot.params);
    state.history.unshift({ method: state.submittedSnapshot.method, maxPotential: snap.maxPotential, actual: snap.actual, achievement: snap.achievement, status: 'approved' });
    state.status = 'approved';
    render();
    showToast(t('toastApproved'), 'moss');
  });

  const btnRejectToggle = document.getElementById('btn-reject-toggle');
  if (btnRejectToggle) btnRejectToggle.addEventListener('click', () => {
    document.getElementById('reject-panel').classList.toggle('hidden');
  });

  const btnConfirmReject = document.getElementById('btn-confirm-reject');
  if (btnConfirmReject) btnConfirmReject.addEventListener('click', () => {
    const note = document.getElementById('reject-note').value.trim();
    const snap = calc(state.submittedSnapshot.method, state.submittedSnapshot.employees, state.submittedSnapshot.params);
    state.history.unshift({ method: state.submittedSnapshot.method, maxPotential: snap.maxPotential, actual: snap.actual, achievement: snap.achievement, status: 'rejected' });
    state.rejectNote = note;
    state.status = 'rejected';
    render();
    showToast(t('toastRejected'), 'rust');
  });
}

/* ============ EVENTS: SETTINGS ============ */
function attachSettingsEvents() {
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const newLang = btn.dataset.lang;
      state.lang = newLang;
      render();
      showToast(newLang === 'id' ? I18N.id.toastLangChanged : I18N.en.toastLangChangedEn, 'moss');
    });
  });
  document.querySelectorAll('.settings-method-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (state.status === 'pending' || state.status === 'approved') {
        showToast(t('toastMethodLocked'), 'rust');
        return;
      }
      state.method = btn.dataset.method;
      render();
      showToast(`${t('toastMethodSet')} ${btn.dataset.method}.`, 'moss');
    });
  });
  const btnReset = document.getElementById('btn-reset-cycle');
  if (btnReset) btnReset.addEventListener('click', () => {
    state.status = 'draft';
    state.submittedSnapshot = null;
    state.rejectNote = '';
    render();
    showToast(t('toastCycleReset'), 'gold');
  });
  const btnCreatorLogout = document.getElementById('btn-creator-logout');
  if (btnCreatorLogout) btnCreatorLogout.addEventListener('click', () => {
    state.creatorAuthed = false;
    render();
    showToast(t('toastCreatorLogout'), 'gold');
  });
  const btnApproverLogout = document.getElementById('btn-approver-logout');
  if (btnApproverLogout) btnApproverLogout.addEventListener('click', () => {
    state.approverAuthed = false;
    render();
    showToast(t('toastApproverLogout'), 'gold');
  });
}

/* ============ INIT ============ */
render();
</script>
</body>
</html>
