<!--
  =============================================================================
  WFM Billing Practice
  Billing Calculation System — PPM (Price Per Man Power)

  Author   : Alvian Ibnu Farhan · 2251171
  Team     : CCS | MIS - OPG2 | Unit3
  Project  : WFM Practice

  Overview
  --------
  A single-file, client-only web app that simulates a two-layer manpower
  billing workflow:
    1. Billing Creator — sets contract parameters and per-employee active
       days, then submits the calculated billing for approval.
    2. Billing Approver — reviews the submitted (locked) snapshot and either
       approves or rejects it, optionally with a note.

  There is no backend: all state lives in memory (the `state` object) and is
  rebuilt into the DOM on every change via the `render()` function
  (a minimal virtual-DOM-free re-render pattern — the entire #app subtree is
  replaced on each state change, and event listeners are re-attached after
  every render call).

  Dependencies (loaded via CDN, see <head>):
    - Chart.js   : renders the Max Potential vs Actual bar chart
    - Tailwind   : utility-first styling (config extended with brand colors)
    - Google Fonts (Inter / IBM Plex Mono / Fraunces)
  =============================================================================
-->

<body class="text-ink min-h-screen">

<!-- Entire application is rendered into this single mount point by render() -->
<div id="app"></div>

<script>
/**
 * =============================================================================
 * WFM Billing Practice — application script
 *
 * Author  : Alvian Ibnu Farhan · 2251171
 * Team    : CCS | MIS - OPG2 | Unit3
 * Project : WFM Practice
 * =============================================================================
 *
 * Architecture summary
 * ---------------------
 * - `state`            : single mutable object holding all app state.
 * - `render()`          : rebuilds the entire #app innerHTML from `state`,
 *                          then re-attaches all event listeners. Called after
 *                          every state mutation (no diffing / virtual DOM).
 * - `attach*Events()`    : query the freshly-rendered DOM for interactive
 *                          elements and wire up their listeners.
 * - `calc()`             : pure function — given employees + params, returns
 *                          { maxPotential, actual, achievement, rows }.
 *
 * Data flow for a billing cycle
 * ------------------------------
 *   Creator edits params/employees (state.params / state.employees, "live")
 *     -> Creator clicks "Submit Billing for Approval"
 *     -> a deep-cloned snapshot is stored in state.submittedSnapshot
 *     -> state.status becomes 'pending' (live data is now locked)
 *     -> Approver reviews the snapshot and approves/rejects
 *     -> state.status becomes 'approved' or 'rejected'
 */

/* ============================================================
 * CONSTANTS
 * ============================================================ */

/** Password gating the Approver (Layer 2) view. Demo-only, not for production auth. */
const APPROVER_PASSWORD = 'approve2026';

/** Password gating the Billing Creator (Layer 1) view. Demo-only, not for production auth. */
const CREATOR_PASSWORD = 'create2026';

/* ============================================================
 * SEED DATA
 * ============================================================ */

/** Auto-increment counter for new employee NIPs added via the "Add Employee" modal. */
let nextNip = 2271;

/**
 * Initial employee roster (PPM billing basis).
 * `days` = number of active/working days out of the period's `fullDays`,
 * used to prorate that employee's billing contribution.
 */
const initialEmployees = [
  { nip: 2261, name: 'Aurel',   note: 'Full month', days: 31 },
  { nip: 2262, name: 'Budi',    note: 'Full month', days: 31 },
  { nip: 2263, name: 'Dery',    note: 'Full month', days: 31 },
  { nip: 2264, name: 'Aria',    note: 'Full month', days: 31 },
  { nip: 2265, name: 'Yuni',    note: 'Full month', days: 31 },
  { nip: 2266, name: 'Sarifin', note: 'Full month', days: 31 },
  { nip: 2267, name: 'Amalia',  note: 'Full month', days: 31 },
  { nip: 2268, name: 'Abdul',   note: 'Full month', days: 31 },
  { nip: 2269, name: 'Ali',     note: 'Joined mid-month (11 May)', days: 21 },
  { nip: 2270, name: 'Lisa',    note: 'Resigned before month-end (25 May)', days: 24 },
];

/**
 * Default contract parameters for the PPM (Price Per Man Power) scheme.
 * @property {number} fullDays   Number of days in the billing period (prorating base).
 * @property {number} rateBase   Rate in Rupiah per man power for a full period.
 * @property {number} standardMp Contracted/standard number of man power.
 */
const initialParams = {
  fullDays: 31,
  rateBase: 10000000,   // Rp / manpower / month (PPM)
  standardMp: 10,
};

/* ============================================================
 * APPLICATION STATE
 * ============================================================
 * Single source of truth for the whole app. Mutated directly by event
 * handlers, then `render()` is called to reflect the change in the DOM.
 */
let state = {
  role: 'creator',           // 'creator' | 'approver' — which layer/view is active
  status: 'draft',           // 'draft' | 'pending' | 'approved' | 'rejected'
  employees: JSON.parse(JSON.stringify(initialEmployees)), // live/editable roster
  params: JSON.parse(JSON.stringify(initialParams)),       // live/editable contract params
  rejectNote: '',            // approver's note when rejecting a billing
  submittedSnapshot: null,   // deep-cloned { employees, params } captured at submit time
  lastEditedNip: null,       // NIP of the row to flash after a days-value change

  // creator auth (simple client-side password gate; see CREATOR_PASSWORD)
  creatorAuthed: false,
  creatorAuthError: '',

  // approver auth (simple client-side password gate; see APPROVER_PASSWORD)
  approverAuthed: false,
  authError: '',

  // employee add/edit modal
  empModal: null,            // null | { mode: 'add'|'edit', nip, name, note, days }
  empDeleteConfirm: null,    // NIP currently showing an inline delete confirmation

  // contract parameters inline-edit mode
  editingParams: false,
  paramsDraft: null,         // working copy of `params` while editingParams is true
};

/** Chart.js instance handle, so it can be destroyed/recreated on re-render. */
let chartInstance = null;

/** Handle for the active toast's auto-dismiss timer, so a new toast can cancel it. */
let toastTimeout = null;

/** Formats a number as Indonesian Rupiah, e.g. 10000000 -> "Rp 10.000.000". */
const fmtIDR = (n) => 'Rp ' + Math.round(n).toLocaleString('id-ID');

/* ============================================================
 * CALCULATIONS
 * ============================================================ */

/**
 * Pure calculation function for the PPM billing scheme.
 *
 * Max Potential = standardMp × rateBase (i.e. full contracted billing if
 * every man power worked the full period).
 * Actual Bill   = sum over employees of (activeDays / fullDays) × rateBase
 *                 (each employee prorated by their active days).
 * Achievement   = Actual / Max Potential, as a percentage.
 *
 * @param {Array<{nip:number,name:string,note:string,days:number}>} employees
 * @param {{fullDays:number, rateBase:number, standardMp:number}} params
 * @returns {{maxPotential:number, actual:number, achievement:number, rows:Array}}
 *          `rows` = employees enriched with a computed `bill` field.
 */
function calc(employees, params) {
  const maxPotential = params.standardMp * params.rateBase;
  const rows = employees.map(e => {
    const bill = (e.days / params.fullDays) * params.rateBase;
    return { ...e, bill };
  });
  const actual = rows.reduce((sum, r) => sum + r.bill, 0);
  const achievement = maxPotential > 0 ? (actual / maxPotential) * 100 : 0;
  return { maxPotential, actual, achievement, rows };
}

/* ============================================================
 * TOAST NOTIFICATIONS
 * ============================================================ */

/**
 * Shows a transient toast message in the bottom-right corner.
 * Replaces any currently-visible toast and resets its auto-dismiss timer.
 *
 * @param {string} message   Toast text (may contain pre-escaped HTML).
 * @param {'moss'|'rust'|'gold'} [tone='moss']  Visual tone / icon color.
 */
function showToast(message, tone = 'moss') {
  const host = document.getElementById('toast-host');
  if (!host) return;
  clearTimeout(toastTimeout);
  const toneMap = {
    moss: { bg: 'bg-moss-700', icon: '✓' },
    rust: { bg: 'bg-rust', icon: '✕' },
    gold: { bg: 'bg-gold', icon: '!' },
  };
  const t = toneMap[tone] || toneMap.moss;
  host.innerHTML = `
    <div class="toast-enter ${t.bg} text-paper px-5 py-3.5 rounded-lg shadow-2xl flex items-center gap-3 min-w-[280px] max-w-[380px]" id="toast-el">
      <span class="w-6 h-6 rounded-full bg-white/20 flex items-center justify-center text-sm font-bold shrink-0">${t.icon}</span>
      <span class="text-sm font-medium leading-snug">${message}</span>
    </div>`;
  toastTimeout = setTimeout(() => {
    const el = document.getElementById('toast-el');
    if (el) {
      el.classList.remove('toast-enter');
      el.classList.add('toast-exit');
      setTimeout(() => { host.innerHTML = ''; }, 280);
    }
  }, 3200);
}

/* ============================================================
 * MAIN RENDER
 * ============================================================
 * The app uses a "full re-render" pattern: every state change triggers a
 * complete rebuild of #app's innerHTML from the current `state`, followed
 * by re-attaching all event listeners (since the old DOM nodes — and their
 * listeners — were just discarded).
 */

/**
 * Rebuilds the entire app DOM from the current `state` and re-attaches
 * all event listeners. This is the single re-render entry point; every
 * event handler in this file ends by calling `render()`.
 */
function render() {
  const app = document.getElementById('app');
  const { maxPotential, actual, achievement, rows } = calc(state.employees, state.params);

  app.innerHTML = `
    ${renderHeader()}
    <div id="toast-host" class="fixed bottom-6 right-6 z-50"></div>
    <main class="max-w-[1400px] mx-auto px-6 lg:px-10 py-8">
      ${state.role === 'creator' ? renderCreatorGate(maxPotential, actual, achievement, rows) : renderApproverGate(maxPotential, actual, achievement, rows)}
    </main>
    ${renderFooter()}
    ${state.empModal ? renderEmployeeModal() : ''}
  `;

  attachHeaderEvents();

  if (state.role === 'creator') {
    if (state.creatorAuthed) {
      attachCreatorEvents();
      drawChart('chart-canvas', maxPotential, actual, false);
    } else {
      attachCreatorGateEvents();
    }
  } else {
    attachApproverEvents();
    // Only draw the approver's chart once authenticated and a billing exists.
    if (state.approverAuthed && state.status !== 'draft') {
      drawChart('chart-canvas-approver', maxPotential, actual, true);
    }
  }

  if (state.empModal) attachEmployeeModalEvents();
}

/**
 * Renders the sticky page footer: current contract scheme summary (left)
 * and the author/attribution block (right).
 */
function renderFooter() {
  return `
    <footer class="max-w-[1400px] mx-auto px-6 lg:px-10 pb-10 pt-4 border-t border-moss-200/60 mt-6">
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
        <div class="flex items-center gap-2 text-xs text-moss-700/60 font-mono flex-wrap">
          <span>SCHEME · PPM · RATE ${fmtIDR(state.params.rateBase)} / MP</span>
        </div>
        <!-- Author / attribution block -->
        <div class="border border-moss-300/60 rounded-lg bg-white/70 px-4 py-2.5 leading-tight">
          <p class="text-xs font-semibold text-moss-800">Alvian Ibnu Farhan <span class="text-moss-700/50 font-normal">· 2251171</span></p>
          <p class="text-[11px] text-moss-800/60 font-mono">CCS | MIS - OPG2 | Unit3</p>
          <p class="text-[11px] text-moss-700/70 font-mono font-semibold tracking-wide">WFM Practice</p>
        </div>
      </div>
    </footer>`;
}

/**
 * Returns the status badge markup for the current `state.status`.
 * @returns {string} HTML for a small colored badge.
 */
function statusBadge() {
  const map = {
    draft:    { label: 'DRAFT — BELUM DISUBMIT', cls: 'bg-moss-100 text-moss-700 border-moss-300' },
    pending:  { label: 'PENDING APPROVAL', cls: 'bg-gold/15 text-gold border-gold/40' },
    approved: { label: 'APPROVED', cls: 'bg-moss-600 text-paper border-moss-700' },
    rejected: { label: 'REJECTED', cls: 'bg-rust/15 text-rust border-rust/40' },
  };
  const s = map[state.status];
  return `<span class="font-mono text-[11px] tracking-wider px-2.5 py-1 rounded border ${s.cls} font-semibold">${s.label}</span>`;
}

/**
 * Renders the sticky top header: brand mark, title, status badge, and the
 * Creator/Approver role switcher.
 */
function renderHeader() {
  return `
  <header class="border-b border-moss-300/70 bg-paper/95 backdrop-blur sticky top-0 z-40">
    <div class="max-w-[1400px] mx-auto px-6 lg:px-10 py-4 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded bg-moss-700 flex items-center justify-center shrink-0">
          <span class="font-display text-paper text-lg leading-none pb-0.5">AIF</span>
        </div>
        <div>
          <h1 class="font-display text-xl font-semibold leading-tight tracking-tight">WFM Billing Practice</h1>
          <p class="text-[11px] font-mono text-moss-700/70 -mt-0.5">Manpower Billing</p>
        </div>
        <div class="hidden md:block ml-2">${statusBadge()}</div>
      </div>

      <div class="flex items-center gap-2 bg-ledger rounded-full p-1 border border-moss-300/60">
        <button data-role="creator" class="role-btn px-4 py-1.5 rounded-full text-sm font-semibold font-mono transition-all ${state.role === 'creator' ? 'bg-moss-700 text-paper shadow-sm' : 'text-moss-700/70 hover:text-moss-700'}">
          CREATOR
        </button>
        <button data-role="approver" class="role-btn px-4 py-1.5 rounded-full text-sm font-semibold font-mono transition-all ${state.role === 'approver' ? 'bg-moss-700 text-paper shadow-sm' : 'text-moss-700/70 hover:text-moss-700'}">
          APPROVER
        </button>
      </div>
    </div>
    <div class="md:hidden px-6 pb-3">${statusBadge()}</div>
  </header>`;
}

/* ---------- CONTRACT PARAMETERS PANEL (Layer 1: Creator) ---------- */

/**
 * Renders the editable "Contract Parameters" card (rate, standard man
 * power, full days). Shows read-only values, or number inputs plus
 * Save/Cancel when `state.editingParams` is true.
 *
 * @param {boolean} locked  True once the billing has been submitted
 *                          (status is 'pending' or 'approved') — hides the
 *                          Edit button entirely and shows a "LOCKED" tag.
 */
function renderParamsPanel(locked) {
  const p = state.editingParams ? state.paramsDraft : state.params;
  return `
  <div class="bg-white/60 border border-moss-300/60 rounded-xl p-5 mb-6">
    <div class="flex items-center justify-between mb-4">
      <div>
        <h3 class="font-semibold text-sm tracking-wide">Parameter Kontrak</h3>
        <p class="text-xs text-moss-800/60 mt-0.5">Skema Price Per Month (PPM) — sesuaikan sesuai kontrak berjalan.</p>
      </div>
      ${!locked ? (state.editingParams ? `
        <div class="flex items-center gap-2">
          <button id="btn-params-cancel" class="text-xs font-mono px-3 py-1.5 rounded border border-moss-300 text-moss-700 hover:bg-moss-50">CANCEL</button>
          <button id="btn-params-save" class="text-xs font-mono px-3 py-1.5 rounded bg-moss-700 text-paper hover:bg-moss-800">SAVE</button>
        </div>
      ` : `
        <button id="btn-params-edit" class="text-xs font-mono px-3 py-1.5 rounded border border-moss-400 text-moss-700 hover:bg-moss-100 flex items-center gap-1.5">
          <span>✎</span> EDIT PARAMETER
        </button>
      `) : `<span class="font-mono text-[10px] text-moss-700/50">LOCKED</span>`}
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div>
        <label class="text-[11px] font-mono text-moss-700/60 tracking-wide block mb-1.5">PRICE / MAN POWER (Rp)</label>
        ${state.editingParams ? `
          <input type="number" id="param-rateBase" value="${p.rateBase}" min="0" step="100000"
            class="w-full border border-moss-300 rounded-lg px-3 py-2 text-sm font-mono bg-white focus:outline-none focus:ring-1 focus:ring-moss-500">
        ` : `<p class="font-mono text-lg font-semibold text-moss-800">${fmtIDR(p.rateBase)}</p>`}
      </div>
      <div>
        <label class="text-[11px] font-mono text-moss-700/60 tracking-wide block mb-1.5"># MAN POWER (STANDAR)</label>
        ${state.editingParams ? `
          <input type="number" id="param-standardMp" value="${p.standardMp}" min="1" step="1"
            class="w-full border border-moss-300 rounded-lg px-3 py-2 text-sm font-mono bg-white focus:outline-none focus:ring-1 focus:ring-moss-500">
        ` : `<p class="font-mono text-lg font-semibold text-moss-800">${p.standardMp} orang</p>`}
      </div>
      <div>
        <label class="text-[11px] font-mono text-moss-700/60 tracking-wide block mb-1.5">FULL DAYS (BASE HARI)</label>
        ${state.editingParams ? `
          <input type="number" id="param-fullDays" value="${p.fullDays}" min="1" max="31" step="1"
            class="w-full border border-moss-300 rounded-lg px-3 py-2 text-sm font-mono bg-white focus:outline-none focus:ring-1 focus:ring-moss-500">
        ` : `<p class="font-mono text-lg font-semibold text-moss-800">${p.fullDays} hari</p>`}
      </div>
    </div>
  </div>`;
}

/* ---------- CREATOR: PASSWORD GATE (Layer 1 entry point) ---------- */

/**
 * Gatekeeper for the Creator view. Renders the password login form if
 * `state.creatorAuthed` is false; otherwise delegates to `renderCreator()`.
 *
 * @param {number} maxPotential
 * @param {number} actual
 * @param {number} achievement
 * @param {Array}  rows
 */
function renderCreatorGate(maxPotential, actual, achievement, rows) {
  if (!state.creatorAuthed) {
    return `
    <div class="mb-6">
      <p class="font-mono text-xs text-moss-700/70 tracking-wide mb-1">LAYER 1</p>
      <h2 class="font-display text-2xl font-semibold">Billing Creator</h2>
    </div>
    <div class="max-w-sm mx-auto border border-moss-300/60 rounded-xl bg-white/60 p-8 mt-12 ${state.creatorAuthError ? 'shake' : ''}" id="creator-auth-box">
      <div class="w-12 h-12 rounded-full bg-ledger flex items-center justify-center mb-4 mx-auto">
        <span class="font-display text-xl text-moss-700">🔒</span>
      </div>
      <h3 class="font-semibold text-center text-moss-800 mb-1">Akses Terbatas</h3>
      <p class="text-xs text-center text-moss-800/60 mb-5">Masukkan password creator untuk melanjutkan ke halaman pembuatan billing.</p>

        class="w-full border ${state.creatorAuthError ? 'border-rust' : 'border-moss-300'} rounded-lg px-3 py-2.5 text-sm font-mono bg-white focus:outline-none focus:ring-1 focus:ring-moss-500 text-center tracking-widest">
      ${state.creatorAuthError ? `<p class="text-xs text-rust text-center mt-2">${state.creatorAuthError}</p>` : ''}

    </div>`;
  }
  return renderCreator(maxPotential, actual, achievement, rows);
}

/* ---------- CREATOR VIEW (Layer 1) ---------- */

/**

 * @param {number} maxPotential
 * @param {number} actual

  const locked = state.status === 'pending' || state.status === 'approved';
  return `

      <div class="overflow-x-auto max-h-[520px]">

/* ---------- APPROVER VIEW (Layer 2) ---------- */

/**
 * Renders the authenticated Approver page.
 * - If no billing has ever been submitted (`status === 'draft'`), shows an
 *   empty-state placeholder.
 * - Otherwise recalculates from the locked `submittedSnapshot` (not the
 *   live/editable `state.employees`/`state.params`) and renders the KPI
 *   cards, read-only employee table, chart, and the Approve/Reject actions.
 *
 * Note: the `maxPotential`/`actual`/`achievement`/`rows` parameters passed
 * in reflect the *live* Creator-side state and are intentionally not used
 * here — the Approver must only ever see the immutable submitted snapshot.
 */
function renderApprover(maxPotential, actual, achievement, rows) {
  if (state.status === 'draft') {
    return `
    <div class="mb-6 flex items-center justify-between flex-wrap gap-3">
      <div>
        <p class="font-mono text-xs text-moss-700/70 tracking-wide mb-1">LAYER 2</p>

      </div>
      <button id="btn-approver-logout" class="text-xs font-mono px-3 py-1.5 rounded border border-moss-300 text-moss-700 hover:bg-moss-100">LOGOUT</button>
    </div>
    <div class="border border-dashed border-moss-300 rounded-xl bg-white/40 py-24 flex flex-col items-center justify-center text-center px-6">
      <div class="w-14 h-14 rounded-full bg-ledger flex items-center justify-center mb-4">
        <span class="font-display text-2xl text-moss-700/50">—</span>
      </div>
      <h3 class="font-semibold text-moss-800 mb-1">Belum ada billing untuk direview</h3>
      <p class="text-sm text-moss-800/60 max-w-sm">Creator belum melakukan submit billing periode Mei 2026. Silakan cek kembali setelah Creator submit dokumen.</p>
    </div>`;
  }

  // Always recompute from the locked snapshot, never from the live Creator state.
  const snap = calc(state.submittedSnapshot.employees, state.submittedSnapshot.params);

  return `
  <div class="mb-6 flex items-start justify-between flex-wrap gap-4">
    <div>
      <p class="font-mono text-xs text-moss-700/70 tracking-wide mb-1">LAYER 2</p>
      <h2 class="font-display text-2xl font-semibold">Billing Approver</h2>
      <p class="text-sm text-moss-800/70 mt-1 max-w-2xl">Review ringkasan billing yang disubmit Creator untuk periode Mei 2026, lalu approve atau tolak.</p>
    </div>
    <div class="flex items-center gap-3">
      ${state.status === 'approved' ? `
        <div class="stamp border-2 border-moss-700 text-moss-700 rounded-lg px-5 py-2 font-mono font-bold tracking-widest text-sm -rotate-6 select-none">
          ✓ APPROVED
        </div>` : state.status === 'rejected' ? `
        <div class="stamp border-2 border-rust text-rust rounded-lg px-5 py-2 font-mono font-bold tracking-widest text-sm -rotate-6 select-none">
          ✕ REJECTED
        </div>` : ''}
      <button id="btn-approver-logout" class="text-xs font-mono px-3 py-1.5 rounded border border-moss-300 text-moss-700 hover:bg-moss-100 h-fit">LOGOUT</button>
    </div>
  </div>

  ${renderKPICards(snap.maxPotential, snap.actual, snap.achievement)}

  <div class="grid grid-cols-1 xl:grid-cols-5 gap-6 mt-6">
    <div class="xl:col-span-3 bg-white/60 border border-moss-300/60 rounded-xl overflow-hidden">
      <div class="px-5 py-4 border-b border-moss-300/60 flex items-center justify-between">
        <h3 class="font-semibold text-sm tracking-wide">Data Karyawan (Read-only)</h3>
        <span class="font-mono text-[11px] text-moss-700/60">Submitted snapshot</span>
      </div>
      <div class="overflow-x-auto max-h-[420px]">
        <table class="w-full text-sm">
          <thead class="bg-ledger/70 sticky top-0">
            <tr class="text-left text-moss-700/70 font-mono text-[11px] tracking-wide">
              <th class="px-5 py-2.5 font-medium">NIP</th>
              <th class="px-3 py-2.5 font-medium">Nama</th>
              <th class="px-3 py-2.5 font-medium">Keterangan</th>
              <th class="px-3 py-2.5 font-medium text-right">Hari Aktif</th>
              <th class="px-5 py-2.5 font-medium text-right">Billing (Rp)</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-moss-200/60">
            ${snap.rows.map(r => `
              <tr>
                <td class="px-5 py-3 font-mono text-xs text-moss-700/80">${r.nip}</td>
                <td class="px-3 py-3 font-medium">${escapeHtml(r.name)}</td>
                <td class="px-3 py-3 text-xs text-moss-800/60">${escapeHtml(r.note)}</td>
                <td class="px-3 py-3 text-right font-mono text-xs">${r.days}/${state.submittedSnapshot.params.fullDays}</td>
                <td class="px-5 py-3 text-right font-mono text-xs font-semibold">${fmtIDR(r.bill)}</td>
              </tr>
            `).join('')}
          </tbody>
          <tfoot class="bg-ledger/70 border-t-2 border-moss-400/50">
            <tr>
              <td colspan="4" class="px-5 py-3 text-right font-mono text-xs font-semibold tracking-wide">TOTAL ACTUAL BILL</td>
              <td class="px-5 py-3 text-right font-mono text-sm font-bold text-moss-800">${fmtIDR(snap.actual)}</td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>

    <div class="xl:col-span-2 bg-white/60 border border-moss-300/60 rounded-xl p-5 flex flex-col">
      <h3 class="font-semibold text-sm tracking-wide mb-1">Max Potential vs Actual</h3>
      <p class="text-xs text-moss-800/60 mb-4">Ringkasan komparasi untuk periode yang disubmit.</p>
      <div class="flex-1 min-h-[240px] relative">
        <canvas id="chart-canvas-approver"></canvas>
      </div>

      <div class="mt-5 pt-4 border-t border-moss-200/60 space-y-3">
        ${state.status === 'pending' ? `
          <div class="grid grid-cols-2 gap-3">
            <button id="btn-approve" class="bg-moss-700 hover:bg-moss-800 text-paper font-semibold text-sm py-3 rounded-lg transition-colors shadow-sm">
              Approve Billing
            </button>
            <button id="btn-reject-toggle" class="bg-white border border-rust text-rust hover:bg-rust/10 font-semibold text-sm py-3 rounded-lg transition-colors">
              Reject Billing
            </button>
          </div>
          <div id="reject-panel" class="hidden space-y-2 pt-1">
            <label class="text-xs font-mono text-moss-700/70 tracking-wide">CATATAN / ALASAN PENOLAKAN</label>
            <textarea id="reject-note" rows="3" placeholder="Jelaskan alasan penolakan billing ini..."
              class="w-full text-sm border border-moss-300 rounded-lg px-3 py-2 bg-white focus:outline-none focus:ring-1 focus:ring-rust resize-none"></textarea>
            <button id="btn-confirm-reject" class="w-full bg-rust hover:bg-rust/90 text-paper font-semibold text-sm py-2.5 rounded-lg transition-colors">

            </button>

        ` : state.status === 'approved' ? `
          <div class="rounded-lg border border-moss-400 bg-moss-100/60 px-4 py-3 text-sm text-moss-800">

        `}
      </div>
    </div>
  </div>
  `;
}

/* ---------- KPI CARDS (shared by Creator + Approver views) ---------- */

/**
 * Renders the three summary cards: Max Potential Bill, Actual Bill, and
 * Achievement (with a progress bar). Color of the Achievement figure
 * shifts green/gold/rust based on thresholds (>=95% / >=85% / below).
 *
 * @param {number} maxPotential
 * @param {number} actual
 * @param {number} achievement  Percentage (0-100+).
 */
function renderKPICards(maxPotential, actual, achievement) {
  const achColor = achievement >= 95 ? 'text-moss-600' : achievement >= 85 ? 'text-gold' : 'text-rust';
  return `
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
    <div class="bg-white/60 border border-moss-300/60 rounded-xl p-5">
      <p class="font-mono text-[11px] tracking-wide text-moss-700/60 mb-2">MAX POTENTIAL BILL</p>
      <p class="font-display text-2xl font-semibold text-moss-800">${fmtIDR(maxPotential)}</p>
      <p class="text-xs text-moss-800/50 mt-1.5">${state.params.standardMp} MP × ${fmtIDR(state.params.rateBase)}</p>
    </div>
    <div class="bg-white/60 border border-moss-300/60 rounded-xl p-5">
      <p class="font-mono text-[11px] tracking-wide text-moss-700/60 mb-2">ACTUAL BILL</p>
      <p class="font-display text-2xl font-semibold text-moss-800">${fmtIDR(actual)}</p>
      <p class="text-xs text-moss-800/50 mt-1.5">Prorate hari aktif / ${state.params.fullDays} hari</p>
    </div>
    <div class="bg-white/60 border border-moss-300/60 rounded-xl p-5">
      <p class="font-mono text-[11px] tracking-wide text-moss-700/60 mb-2">RATE</p>
      <p class="font-display text-2xl font-semibold ${achColor}">${achievement.toFixed(2)}%</p>
      <div class="w-full h-1.5 bg-ledger rounded-full mt-2.5 overflow-hidden">
        <div class="h-full bg-moss-500 rounded-full transition-all duration-500" style="width:${Math.min(achievement,100)}%"></div>
      </div>
    </div>
  </div>`;
}

/* ---------- CHART ---------- */

/**
 * Draws (or redraws) the Max Potential vs Actual bar chart into the given
 * canvas element using Chart.js. Destroys any previous chart instance
 * first, since only one chart is ever visible at a time.
 *
 * @param {string}  canvasId    DOM id of the target <canvas>.
 * @param {number}  maxPotential
 * @param {number}  actual
 * @param {boolean} small       Use a thinner bar (for the compact Approver chart).
 */
function drawChart(canvasId, maxPotential, actual, small) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  // Guard against the Chart.js CDN failing to load (e.g. offline / blocked) —
  // fail silently rather than throwing and interrupting the caller.
  if (typeof Chart === 'undefined') return;
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
  const ctx = canvas.getContext('2d');

  chartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: ['Max Potential', 'Actual Bill'],
      datasets: [{
        data: [maxPotential, actual],
        backgroundColor: ['#C3D3A6', '#46602E'],
        borderRadius: 6,
        borderSkipped: false,
        barThickness: small ? 46 : 64,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1D2814',
          titleFont: { family: 'IBM Plex Mono' },
          bodyFont: { family: 'IBM Plex Mono' },
          padding: 10,
          callbacks: {
            label: (c) => ' ' + fmtIDR(c.parsed.y)
          }
        }
      },
      scales: {
        y: {
          beginAtZero: true,
          grid: { color: 'rgba(70,96,46,0.1)' },
          ticks: {
            font: { family: 'IBM Plex Mono', size: 10 },
            color: '#46602E',
            callback: (v) => 'Rp ' + (v/1000000) + 'jt'
          }
        },
        x: {
          grid: { display: false },
          ticks: { font: { family: 'Inter', size: 12, weight: '600' }, color: '#1D2814' }
        }
      }
    }
  });
}

/* ============================================================
 * UTILITIES
 * ============================================================ */

/**
 * Escapes a string for safe interpolation into innerHTML, preventing
 * HTML/attribute injection from user-entered employee names/notes/etc.
 * @param {*} str  Any value; null/undefined become an empty string.
 * @returns {string}
 */
function escapeHtml(str) {
  if (str === undefined || str === null) return '';
  return String(str)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#39;');
}

/* ============================================================
 * EVENT WIRING
 * ============================================================
 * Each attach*Events() function is called after every render() and queries
 * the fresh DOM for the elements it cares about. Handlers mutate `state`
 * directly and finish by calling render() to reflect the change.
 */

/** Wires the Creator/Approver role-switcher buttons in the header. */
function attachHeaderEvents() {
  document.querySelectorAll('.role-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.role = btn.dataset.role;
      render();
    });
  });
}

/**
 * Wires the Creator password login gate: submit-on-click and submit-on-Enter,
 * with a shake animation + inline error on wrong password.
 */
function attachCreatorGateEvents() {
  const btnLogin = document.getElementById('btn-creator-login');
  const pwInput = document.getElementById('creator-password');
  if (btnLogin && pwInput) {
    const tryLogin = () => {
      if (pwInput.value === CREATOR_PASSWORD) {
        state.creatorAuthed = true;
        state.creatorAuthError = '';
        render();
      } else {
        state.creatorAuthError = 'Password salah. Silakan coba lagi.';
        render();
      }
    };
    btnLogin.addEventListener('click', tryLogin);
    pwInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryLogin(); });
    pwInput.focus();
  }
}

/**
 * Wires all interactive elements on the Creator (Layer 1) page:
 * contract parameter edit/save/cancel, per-employee active-days
 * slider/input, employee add/edit/delete CRUD triggers, and Submit.
 */
function attachCreatorEvents() {
  // --- Logout ---
  const btnLogout = document.getElementById('btn-creator-logout');
  if (btnLogout) {
    btnLogout.addEventListener('click', () => {
      state.creatorAuthed = false;
      state.creatorAuthError = '';
      render();
      showToast('Logout dari sesi Creator.', 'gold');
    });
  }

  // --- Contract parameters: edit / cancel / save ---
  const btnParamsEdit = document.getElementById('btn-params-edit');
  if (btnParamsEdit) {
    btnParamsEdit.addEventListener('click', () => {
      state.editingParams = true;
      state.paramsDraft = JSON.parse(JSON.stringify(state.params));
      render();
    });
  }
  const btnParamsCancel = document.getElementById('btn-params-cancel');
  if (btnParamsCancel) {
    btnParamsCancel.addEventListener('click', () => {
      state.editingParams = false;
      state.paramsDraft = null;
      render();
    });
  }
  const btnParamsSave = document.getElementById('btn-params-save');
  if (btnParamsSave) {
    btnParamsSave.addEventListener('click', () => {
      const rateBase = parseFloat(document.getElementById('param-rateBase').value) || 0;
      const standardMp = parseInt(document.getElementById('param-standardMp').value) || 1;
      const fullDays = parseInt(document.getElementById('param-fullDays').value) || 1;

      state.params = {
        rateBase: Math.max(0, rateBase),
        standardMp: Math.max(1, standardMp),
        fullDays: Math.max(1, Math.min(31, fullDays)),
      };
      // Clamp every employee's active days so none exceed the new fullDays base.
      state.employees.forEach(e => { if (e.days > state.params.fullDays) e.days = state.params.fullDays; });

      state.editingParams = false;
      state.paramsDraft = null;
      render();
      showToast('Parameter kontrak berhasil diperbarui.', 'moss');
    });
  }

  // --- Per-employee "active days" controls (slider + numeric input, kept in sync) ---
  document.querySelectorAll('.days-slider').forEach(slider => {
    slider.addEventListener('input', (e) => updateDays(e.target.dataset.nip, e.target.value));
  });
  document.querySelectorAll('.days-input').forEach(input => {
    input.addEventListener('change', (e) => {
      let v = parseInt(e.target.value);
      if (isNaN(v)) v = 0;
      v = Math.max(0, Math.min(state.params.fullDays, v));
      updateDays(e.target.dataset.nip, v);
    });
  });

  // --- Employee CRUD: add / edit / delete (with inline confirm) ---
  const btnAdd = document.getElementById('btn-emp-add');
  if (btnAdd) {
    btnAdd.addEventListener('click', () => {
      state.empModal = { mode: 'add', nip: nextNip, name: '', note: '', days: state.params.fullDays };
      render();
    });
  }
  document.querySelectorAll('.btn-emp-edit').forEach(btn => {
    btn.addEventListener('click', () => {
      const nip = parseInt(btn.dataset.nip);
      const emp = state.employees.find(e => e.nip === nip);
      if (emp) {
        state.empModal = { mode: 'edit', nip: emp.nip, name: emp.name, note: emp.note, days: emp.days };
        render();
      }
    });
  });
  document.querySelectorAll('.btn-emp-delete').forEach(btn => {
    btn.addEventListener('click', () => {
      state.empDeleteConfirm = parseInt(btn.dataset.nip);
      render();
    });
  });
  document.querySelectorAll('.btn-emp-delete-cancel').forEach(btn => {
    btn.addEventListener('click', () => {
      state.empDeleteConfirm = null;
      render();
    });
  });
  document.querySelectorAll('.btn-emp-delete-confirm').forEach(btn => {
    btn.addEventListener('click', () => {
      const nip = parseInt(btn.dataset.nip);
      const emp = state.employees.find(e => e.nip === nip);
      state.employees = state.employees.filter(e => e.nip !== nip);
      state.empDeleteConfirm = null;
      render();
      showToast(`Karyawan ${emp ? escapeHtml(emp.name) : ''} berhasil dihapus.`, 'rust');
    });
  });

  // --- Submit billing for approval (locks live data, snapshots it) ---
  const btnSubmit = document.getElementById('btn-submit');
  if (btnSubmit) {
    btnSubmit.addEventListener('click', () => {
      if (state.employees.length === 0) {
        showToast('Tidak dapat submit: belum ada data karyawan.', 'rust');
        return;
      }
      state.status = 'pending';
      state.submittedSnapshot = {
        employees: JSON.parse(JSON.stringify(state.employees)),
        params: JSON.parse(JSON.stringify(state.params)),
      };
      state.rejectNote = '';
      render();
      showToast('Billing berhasil disubmit dan menunggu approval.', 'gold');
    });
  }
}

/**
 * Updates a single employee's `days` value (from either the slider or the
 * numeric input) and triggers a row-flash highlight on re-render.
 * @param {string|number} nip
 * @param {string|number} value  New active-days value.
 */
function updateDays(nip, value) {
  nip = parseInt(nip);
  const emp = state.employees.find(e => e.nip === nip);
  if (emp) {
    emp.days = parseInt(value);
    state.lastEditedNip = nip;
  }
  render();
  // Reset immediately so the flash animation only plays once per edit.
  state.lastEditedNip = null;
}

/**
 * Wires the Add/Edit Employee modal: close (✕/backdrop/cancel) and save,
 * including inline validation (name required, NIP required/unique).
 */
function attachEmployeeModalEvents() {
  const overlay = document.getElementById('emp-modal-overlay');
  const closeModal = () => { state.empModal = null; render(); };

  const btnClose = document.getElementById('btn-emp-modal-close');
  const btnCancel = document.getElementById('btn-emp-modal-cancel');
  if (btnClose) btnClose.addEventListener('click', closeModal);
  if (btnCancel) btnCancel.addEventListener('click', closeModal);
  if (overlay) {
    // Only close when clicking the backdrop itself, not the modal box.
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) closeModal();
    });
  }

  const btnSave = document.getElementById('btn-emp-modal-save');
  if (btnSave) {
    btnSave.addEventListener('click', () => {
      const errEl = document.getElementById('emp-modal-error');
      const nipVal = parseInt(document.getElementById('emp-nip').value);
      const nameVal = document.getElementById('emp-name').value.trim();
      const noteVal = document.getElementById('emp-note').value.trim();
      let daysVal = parseInt(document.getElementById('emp-days').value);
      if (isNaN(daysVal)) daysVal = 0;
      daysVal = Math.max(0, Math.min(state.params.fullDays, daysVal));

      if (!nameVal) {
        errEl.textContent = 'Nama karyawan wajib diisi.';
        errEl.classList.remove('hidden');
        return;
      }
      if (isNaN(nipVal)) {
        errEl.textContent = 'NIP wajib diisi dan berupa angka.';
        errEl.classList.remove('hidden');
        return;
      }

      if (state.empModal.mode === 'add') {
        if (state.employees.some(e => e.nip === nipVal)) {
          errEl.textContent = 'NIP sudah digunakan karyawan lain.';
          errEl.classList.remove('hidden');
          return;
        }
        state.employees.push({ nip: nipVal, name: nameVal, note: noteVal || '-', days: daysVal });
        if (nipVal >= nextNip) nextNip = nipVal + 1;
        state.empModal = null;
        render();
        showToast(`Karyawan ${escapeHtml(nameVal)} berhasil ditambahkan.`, 'moss');
      } else {
        const emp = state.employees.find(e => e.nip === state.empModal.nip);
        if (emp) {
          emp.name = nameVal;
          emp.note = noteVal || '-';
          emp.days = daysVal;
        }
        state.empModal = null;
        render();
        showToast(`Data ${escapeHtml(nameVal)} berhasil diperbarui.`, 'moss');
      }
    });
  }
}

/**
 * Wires all interactive elements on the Approver (Layer 2) page:
 * password login, logout, Approve, Reject (toggle + confirm with note).
 */
function attachApproverEvents() {
  // --- Password login gate ---
  const btnLogin = document.getElementById('btn-approver-login');
  const pwInput = document.getElementById('approver-password');
  if (btnLogin && pwInput) {
    const tryLogin = () => {
      if (pwInput.value === APPROVER_PASSWORD) {
        state.approverAuthed = true;
        state.authError = '';
        render();
      } else {
        state.authError = 'Password salah. Silakan coba lagi.';
        render();
      }
    };
    btnLogin.addEventListener('click', tryLogin);
    pwInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryLogin(); });
    pwInput.focus();
  }

  const btnLogout = document.getElementById('btn-approver-logout');
  if (btnLogout) {
    btnLogout.addEventListener('click', () => {
      state.approverAuthed = false;
      state.authError = '';
      render();
      showToast('Logout dari sesi Approver.', 'gold');
    });
  }

  // --- Approve ---
  const btnApprove = document.getElementById('btn-approve');
  if (btnApprove) {
    btnApprove.addEventListener('click', () => {
      state.status = 'approved';
      render();
      showToast('Billing telah di-approve.', 'moss');
    });
  }

  // --- Reject (toggle note panel, then confirm) ---
  const btnRejectToggle = document.getElementById('btn-reject-toggle');
  if (btnRejectToggle) {
    btnRejectToggle.addEventListener('click', () => {
      document.getElementById('reject-panel').classList.toggle('hidden');
    });
  }

  const btnConfirmReject = document.getElementById('btn-confirm-reject');
  if (btnConfirmReject) {
    btnConfirmReject.addEventListener('click', () => {
      const note = document.getElementById('reject-note').value.trim();
      state.rejectNote = note;
      state.status = 'rejected';
      render();
      showToast('Billing ditolak. Creator perlu revisi ulang.', 'rust');
    });
  }
}

/* ============================================================
 * INITIAL RENDER
 * ============================================================ */
render();
</script>
